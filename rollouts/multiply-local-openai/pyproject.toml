[project]
name = "multiply-local-openai"
description = "Self-contained local OpenAI Agents multiply rollout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "osmosis-ai[server]>=0.2.30",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["multiply_rollout*"]
