version = "1.0"

[metadata]
author_name = "Osmosis"
difficulty = "easy"
category = "math"
tags = ["multiply", "harbor", "rollout"]

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 120.0

[environment]
# Trials start from this prebuilt image; environment/Dockerfile is built only when a build is forced.
docker_image = "python:3.12-bookworm"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 512
storage_mb = 1024
allow_internet = true
