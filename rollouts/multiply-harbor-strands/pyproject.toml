[project]
name = "multiply-harbor-strands"
description = "Self-contained Harbor Strands multiply rollout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "osmosis-ai[server,strands,harbor]>=0.3.2,<0.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["multiply_rollout*"]
