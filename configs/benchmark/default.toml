[experiment]
# Key from `osmosis benchmark list`; its Name column works too.
benchmark = "terminal-bench-2-1"

# Omit [tasks] to run every task. Choose one selector when narrowing scope;
# task_set = "parity" takes precedence over task_names and categories.
# [tasks]
# For HLE configs, parity is recommended for comparable published scores:
# task_set = "parity"
# Or select exact tasks:
# task_names = ["terminal-bench/git-multibranch"]
# Or select a category (verify its scope separately before approval):
# categories = ["software-engineering"]

[[agents]]
harness = "codex"

[agents.model]
type = "provider"
model = "openai/gpt-5.2"
api_key_secret = "OPENAI_API_KEY"

# [agents.env]
# AGENT_MODE = "strict"

[execution]
attempts_per_task = 1
max_concurrent_attempts = 4
timeout_multiplier = 1.0
max_retries = 0
# Judge fields follow the LLM Judge row of `osmosis benchmark info <key>`:
# "Required (default: <model>)" takes both, judge_model optional;
# "API key only (pinned grader)" takes only the secret; "–" takes neither.
# judge_model = "openai/gpt-5.2"
# judge_api_key_secret = "OPENAI_API_KEY"

# Registry datasets whose verifier reads its own credentials, mapping each
# variable to the secret record supplying it. Managed benchmarks reject this.
# [verifier.env]
# VLM_API_KEY = "MY_VLM_KEY"

# Credentials this run needs that no field above names. Values come from
# --secrets-file, the environment, or a prompt — never from this file, and they
# are not saved between runs.
# [secrets]
# required = ["WEATHER_API_KEY"]

# [env]
# LOG_LEVEL = "info"
