# Multiply eval - local OpenAI Agents backend.
# Command: osmosis eval submit configs/eval/multiply-local-openai.toml

[experiment]
rollout = "multiply-local-openai"
entrypoint = "main.py"
# Eval datasets are platform dataset names, not local data/*.jsonl paths.
dataset = "multiply"
# commit_sha =

[llm]
model_path = "openai/gpt-5-mini"      # LiteLLM-style model name
# Optional LiteLLM/OpenAI-compatible base URL; no default is applied when omitted.
# base_url = "https://api.openai.com/v1"

[evaluation]
# Optional. Omit values to use platform defaults.
# limit = 200
# n = 1
# batch_size = 1
# pass_threshold = 1.0
# agent_workflow_timeout_s = 450
# grader_timeout_s = 150

# [env]
# LOG_LEVEL = "INFO"

# [secrets]
# OPENAI_API_KEY = "openai-api-key"
