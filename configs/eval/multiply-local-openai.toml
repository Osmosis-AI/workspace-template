# Multiply eval - local OpenAI Agents backend.
# Run locally: osmosis eval run configs/eval/multiply-local-openai.toml
# Managed run: osmosis eval submit configs/eval/multiply-local-openai.toml

[experiment]
rollout = "multiply-local-openai"
entrypoint = "main.py"
model_path = "openai/gpt-5-mini"      # LiteLLM-style model name
# Eval datasets are platform dataset names, not local data/*.jsonl paths.
dataset = "multiply"
# branch = "my-feature"
# commit_sha =

[evaluation]
# Optional. Omit values to use defaults for the selected execution mode.
# limit = 200 # First N rows; local omit runs all, managed omit samples.
# n = 1
# batch_size = 1
# pass_threshold = 1.0
# agent_workflow_timeout_s = 450
# grader_timeout_s = 150

# [env]
# LOG_LEVEL = "INFO"

[secrets]
required = ["OPENAI_API_KEY"]
