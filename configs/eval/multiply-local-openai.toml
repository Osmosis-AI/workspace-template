# Multiply eval - local OpenAI Agents backend.
# Command: osmosis eval run configs/eval/multiply-local-openai.toml

[eval]
rollout = "multiply-local-openai"
entrypoint = "main.py"
dataset = "data/multiply.jsonl" # Full local dataset; cap rows here instead of using a sample file
limit = 200                     # Optional row cap for local eval

[llm]
model = "openai/gpt-5-mini"
api_key_env = "OPENAI_API_KEY"

[runs]
n = 1
batch_size = 1
pass_threshold = 1.0

[timeouts]
agent_workflow_timeout_s = 450
grader_timeout_s = 150

[output]
log_samples = false
