# Multiply eval - Harbor Strands backend.
# Run locally: osmosis eval run configs/eval/multiply-harbor-strands.toml
# The SkyPilot sandbox in main.py cannot reach this machine, so the run starts a cloudflared tunnel automatically; keep cloudflared on PATH.
# Managed run: osmosis eval submit configs/eval/multiply-harbor-strands.toml

[experiment]
rollout = "multiply-harbor-strands"
entrypoint = "main.py"
model_path = "openai/gpt-5-mini"      # LiteLLM-style model name
# Eval datasets are platform dataset names, not local data/*.jsonl paths.
dataset = "multiply"
# branch = "my-feature"
# commit_sha =

[evaluation]
# Optional. Omit values to use defaults for the selected execution mode.
# limit = 200 # First N rows; local omit runs all, managed omit samples.
# n = 1
# batch_size = 1
# pass_threshold = 1.0
# agent_workflow_timeout_s = 450
# grader_timeout_s = 150

[secrets]
required = ["OPENAI_API_KEY"]
