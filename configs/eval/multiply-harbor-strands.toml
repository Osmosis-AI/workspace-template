# Multiply eval - Harbor Strands backend.
# Command: osmosis eval submit configs/eval/multiply-harbor-strands.toml

[experiment]
rollout = "multiply-harbor-strands"
entrypoint = "main.py"
model_path = "openai/gpt-5-mini"      # LiteLLM-style model name
# Eval datasets are platform dataset names, not local data/*.jsonl paths.
dataset = "multiply"
# commit_sha =

[evaluation]
# Optional. Omit values to use platform defaults.
# limit = 200
# n = 1
# batch_size = 1
# pass_threshold = 1.0
# agent_workflow_timeout_s = 450
# grader_timeout_s = 150

[secrets]
required = ["DAYTONA_API_KEY"]
