# Multiply eval - local Strands backend.
# Command: osmosis eval submit configs/eval/multiply-local-strands.toml

[experiment]
rollout = "multiply-local-strands"
entrypoint = "main.py"
model_path = "openai/gpt-5-mini"      # LiteLLM-style model name
# Eval datasets are platform dataset names, not local data/*.jsonl paths.
dataset = "multiply"
