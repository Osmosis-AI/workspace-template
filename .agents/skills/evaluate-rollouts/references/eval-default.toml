# Osmosis eval config fallback.
# Use when configs/eval/default.toml is missing from a generated workspace.
# Command after copying: osmosis eval submit configs/eval/<name>.toml

[experiment]
rollout = "<your-rollout>"            # Rollout name
entrypoint = "main.py"                # Entrypoint file name inside rollouts/<rollout>/
dataset = "<your-dataset-name>"       # Platform dataset name
# commit_sha =                        # Optional pinned pushed commit

[llm]
model_path = "openai/gpt-5-mini"      # LiteLLM-style model name
# Optional LiteLLM/OpenAI-compatible base URL. No default is applied when omitted.
# base_url = "https://api.openai.com/v1"

[evaluation]
# Optional. Omit values to use platform defaults.
# limit = 200                         # Optional row cap for cloud eval
# n = 1                               # Number of evaluation attempts
# batch_size = 1                      # Rows evaluated per batch
# pass_threshold = 1.0                # Minimum passing score
# agent_workflow_timeout_s = 450      # Agent workflow timeout per row
# grader_timeout_s = 150              # Grader timeout per row

# [env]
# LOG_LEVEL = "INFO"

# [secrets]
# OPENAI_API_KEY = "openai-api-key"
