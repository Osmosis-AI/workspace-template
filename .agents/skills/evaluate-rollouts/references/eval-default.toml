# Osmosis eval config fallback.
# Use when configs/eval/default.toml is missing from a generated workspace.
# Command after copying: osmosis eval run configs/eval/<name>.toml

[eval]
rollout = "<your-rollout>"            # Rollout name (directory under rollouts/)
entrypoint = "main.py"                # SDK default; change if the rollout uses another server file
dataset = "data/<your-dataset>.jsonl" # Local eval dataset under data/
# limit = 200                         # Optional row cap for local eval

[llm]
model = "openai/gpt-5-mini"           # Model used for rollout LLM calls
# api_key_env = "OPENAI_API_KEY"      # Environment variable containing the API key
# base_url = "http://localhost:8080"  # Optional custom API base URL

[runs]
n = 1                                 # Number of eval runs
batch_size = 1                        # Rows evaluated per batch
pass_threshold = 1.0                  # Minimum passing score

[timeouts]
agent_workflow_timeout_s = 450        # Agent workflow timeout per row
grader_timeout_s = 150                # Grader timeout per row

[output]
log_samples = false                   # Include sample logs in output
